version: "3.8"
# Redpanda (Kafka-compatible) for local development and testing.
# Usage:
#   docker compose -f deploy/docker-compose-redpanda.yaml up -d
#   rpk topic list --brokers localhost:9092
#   rpk topic consume osac.metering.lifecycle --brokers localhost:9092

services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --smp 1
      - --memory 256M
      - --overprovisioned
      - --default-log-level=warn
    ports:
      - "19092:19092"   # Kafka API (external)
      - "18082:8082"    # Schema Registry
      - "18081:8081"    # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMINAPI_URLS: http://redpanda:8081

volumes:
  redpanda-data:
