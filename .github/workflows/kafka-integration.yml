name: Kafka Integration Test

on:
  push:
    branches: [main]
    paths:
      - 'inventory-watcher/internal/kafka/**'
      - 'inventory-watcher/internal/api/handler.go'
      - 'inventory-watcher/internal/watcher/watcher.go'
      - 'inventory-watcher/cmd/consumer/main.go'
      - 'integration-test/test-kafka.sh'
      - 'deploy/docker-compose-redpanda.yaml'
      - '.github/workflows/kafka-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'inventory-watcher/internal/kafka/**'
      - 'inventory-watcher/internal/api/handler.go'
      - 'inventory-watcher/internal/watcher/watcher.go'
      - 'inventory-watcher/cmd/consumer/main.go'
      - 'integration-test/test-kafka.sh'
      - 'deploy/docker-compose-redpanda.yaml'
      - '.github/workflows/kafka-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kafka-integration:
    name: Kafka (Redpanda)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: costdb
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U user -d costdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: inventory-watcher/go.mod
          cache-dependency-path: inventory-watcher/go.sum

      - name: Start Redpanda
        uses: redpanda-data/github-action@v0.1.4
        with:
          version: 'latest'

      - name: Build consumer
        run: |
          cd inventory-watcher
          go build -o inventory-watcher ./cmd/consumer/

      - name: Run Kafka integration test
        env:
          KAFKA_BROKER_OVERRIDE: localhost:9092
        run: bash integration-test/test-kafka.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Producer log ==="
          cat /tmp/kafka-producer-test.log || true
          echo ""
          echo "=== Consumer log ==="
          cat /tmp/kafka-consumer-test.log || true
