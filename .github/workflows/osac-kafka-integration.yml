name: OSAC → Kafka Integration Test

on:
  push:
    branches: [main]
    paths:
      - 'inventory-watcher/internal/api/handler.go'
      - 'inventory-watcher/internal/kafka/**'
      - 'inventory-watcher/cmd/consumer/main.go'
      - 'integration-test/test-osac-kafka.sh'
      - 'snippets/osac-create-vm.sh'
      - '.github/workflows/osac-kafka-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'inventory-watcher/internal/api/handler.go'
      - 'inventory-watcher/internal/kafka/**'
      - 'inventory-watcher/cmd/consumer/main.go'
      - 'integration-test/test-osac-kafka.sh'
      - 'snippets/osac-create-vm.sh'
      - '.github/workflows/osac-kafka-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pin OSAC components to known-compatible versions. The metering-service
# generates protos from buf.build/osac-project/private-api:v0.0.83 — the
# fulfillment-service must match. Bump together when adopting new versions.
env:
  OSAC_FULFILLMENT_REF: c4110b28a14d4a3b3926ae5360e2cd59c15430d5
  OSAC_METERING_REF: 76c2261233c9f85caa73ff20e70e5da6e98b2b1e

jobs:
  osac-kafka:
    name: OSAC → Kafka → Consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: costdb
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U user -d costdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install Python deps
        run: pip install PyJWT cryptography

      - name: Clone and build fulfillment-service
        run: |
          git clone https://github.com/osac-project/fulfillment-service.git /tmp/fulfillment-service
          cd /tmp/fulfillment-service
          git checkout "$OSAC_FULFILLMENT_REF"
          echo "fulfillment-service at $(git rev-parse --short HEAD)"
          GOTOOLCHAIN=auto go build -o /tmp/fulfillment-service-bin ./cmd/fulfillment-service

      - name: Clone and build metering-service
        run: |
          git init /tmp/osac
          cd /tmp/osac
          git remote add origin https://github.com/osac-project/osac.git
          git fetch --depth=1 origin "$OSAC_METERING_REF"
          git checkout FETCH_HEAD
          cd osac-metering/metering-service
          echo "metering-service at $(git rev-parse --short HEAD)"
          # Patch for plain Kafka (no SASL, no TLS, no mandatory DB)
          sed -i '/KAFKA_SASL_USERNAME is required/d' cmd/metering-service/main.go
          sed -i '/KAFKA_SASL_PASSWORD_FILE is required/d' cmd/metering-service/main.go
          sed -i 's/^func configureSASL.*/func configureSASL(sc *sarama.Config, user, passFile string) error {\n\tif user == "" { return nil }/' internal/kafka/connect.go
          sed -i 's/sc.Net.TLS.Enable = .*$/sc.Net.TLS.Enable = os.Getenv("KAFKA_TLS_DISABLE") != "true"/' internal/kafka/connect.go
          GOTOOLCHAIN=auto go build -o /tmp/metering-service-bin ./cmd/metering-service

      - name: Build cost consumer
        run: |
          cd inventory-watcher
          go build -o inventory-watcher ./cmd/consumer/

      - name: Generate TLS certs
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/certs/server.key -out /tmp/certs/server.crt \
            -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" 2>/dev/null

      - name: Generate auth token
        env:
          OIDC_KEY: /tmp/certs/server.key
          TOKEN_HOURS: "1"
        run: python3 inventory-watcher/scripts/gen_token.py > /tmp/osac_token.txt

      - name: Start OIDC mock
        env:
          OIDC_KEY: /tmp/certs/server.key
          OIDC_CERT: /tmp/certs/server.crt
          OIDC_BIND: "0.0.0.0"
        run: |
          python3 inventory-watcher/scripts/oidc_server.py &
          sleep 2

      - name: Start Kafka (KRaft single-node)
        run: |
          docker run -d --name kafka --network host \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:19092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e CLUSTER_ID=osac-kafka-ci-test-001 \
            apache/kafka:latest

      - name: Wait for Kafka and create topics
        run: |
          for i in $(seq 1 60); do
            docker exec kafka /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server 127.0.0.1:19092 --list 2>/dev/null && break || sleep 2
          done
          for topic in osac.metering.lifecycle osac.metering.heartbeat osac.metering.corrections; do
            docker exec kafka /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server 127.0.0.1:19092 \
              --create --topic "$topic" --partitions 1 --replication-factor 1
          done
          echo "Kafka ready, topics created"

      - name: Create OSAC database
        run: |
          PGPASSWORD=pass psql -h 127.0.0.1 -p 5434 -U user -d costdb \
            -c "CREATE DATABASE osacdb;" || true

      - name: Start fulfillment-service
        env:
          GRPC_ENFORCE_ALPN_ENABLED: "false"
        run: |
          /tmp/fulfillment-service-bin start grpc-server \
            --grpc-listener-address=0.0.0.0:8010 \
            --grpc-listener-tls-crt=/tmp/certs/server.crt \
            --grpc-listener-tls-key=/tmp/certs/server.key \
            --ca-file=/tmp/certs/server.crt \
            --db-url="postgres://user:pass@127.0.0.1:5434/osacdb?sslmode=disable" \
            --token-issuer=https://localhost:8013 \
            --token-signer-key=/tmp/certs/server.key \
            --token-signer-crt=/tmp/certs/server.crt \
            --token-encryption-crt=/tmp/certs/server.crt \
            --grpc-authn-trusted-token-issuers=https://localhost:8013 \
            --metrics-listener-address=127.0.0.1:8003 \
            > /tmp/osac-grpc.log 2>&1 &

          /tmp/fulfillment-service-bin start rest-gateway \
            --http-listener-address=0.0.0.0:8011 \
            --grpc-server-address=localhost:8010 \
            --ca-file=/tmp/certs/server.crt \
            --metrics-listener-address=127.0.0.1:8004 \
            > /tmp/osac-rest.log 2>&1 &

          READY=false
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8011/api/fulfillment/v1/instance_types \
              -H "Authorization: Bearer $(cat /tmp/osac_token.txt)" > /dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            echo "ERROR: OSAC fulfillment-service not ready after 120s"
            tail -30 /tmp/osac-grpc.log || true
            tail -30 /tmp/osac-rest.log || true
            exit 1
          fi
          echo "OSAC fulfillment-service ready"

      - name: Start metering-service
        env:
          FULFILLMENT_SERVER_ADDRESS: localhost:8010
          FULFILLMENT_TOKEN_FILE: /tmp/osac_token.txt
          TLS_CA_CERT: /tmp/certs/server.crt
          KAFKA_BROKERS: 127.0.0.1:19092
          KAFKA_TLS_DISABLE: "true"
          KAFKA_TOPIC: osac.metering.lifecycle
          HEALTH_ADDR: ":8090"
          GRPC_ENFORCE_ALPN_ENABLED: "false"
        run: |
          /tmp/metering-service-bin > /tmp/metering-service.log 2>&1 &
          READY=false
          for i in $(seq 1 90); do
            if grep -q "service ready" /tmp/metering-service.log 2>/dev/null; then
              READY=true
              break
            fi
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            echo "ERROR: metering-service not ready after 180s"
            cat /tmp/metering-service.log || true
            exit 1
          fi
          echo "OSAC metering-service ready"

      - name: Run OSAC → Kafka integration test
        run: bash integration-test/test-osac-kafka.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== OSAC gRPC ==="
          tail -30 /tmp/osac-grpc.log || true
          echo ""
          echo "=== OSAC REST ==="
          tail -30 /tmp/osac-rest.log || true
          echo ""
          echo "=== Metering service ==="
          tail -30 /tmp/metering-service.log || true
          echo ""
          echo "=== Cost consumer ==="
          tail -30 /tmp/cost-consumer-osac.log || true
          echo ""
          echo "=== Kafka ==="
          docker logs kafka --tail 30 || true
